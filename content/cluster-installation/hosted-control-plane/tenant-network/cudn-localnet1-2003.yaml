apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: cudn-localnet1-2003
spec:
  namespaceSelector:
    matchExpressions:
      - key: hypershift.openshift.io/hosted-control-plane
        operator: Exists
  network:
    localnet:
      ipam:
        mode: Disabled
      physicalNetworkName: localnet1
      role: Secondary
      vlan:
        access:
          id: 2003
        mode: Access
    topology: Localnet
